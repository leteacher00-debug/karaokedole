<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaokê do Lê</title>
    <!-- Firebase App & Database (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --accent: #ff0055;
            --accent-hq: #00ffcc;
            --text: #ffffff;
            --subtext: #a0a0b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
        }

        input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0f0f1a;
            color: #fff;
            font-size: 16px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .track-item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 70%;
        }

        .channel-tag {
            font-size: 12px;
            color: var(--subtext);
        }

        .hq-tag {
            color: var(--accent-hq);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎤 Karaokê do Lê</h1>

        <div class="input-group">
            <input type="text" id="cantor-nome" placeholder="Seu Nome (Cantor)" required>
            <input type="text" id="busca-termo" placeholder="Nome da música ou artista">
            <button onclick="window.buscar()">🔍 Buscar Música</button>
        </div>

        <div class="controls">
            <button onclick="comando('play')">▶️ Play</button>
            <button onclick="comando('pause')">⏸️ Pause</button>
            <button onclick="pular()">⏭️ Pular</button>
        </div>

        <h3>Resultados da Busca</h3>
        <div id="resultados"></div>

        <h3>Fila de Espera</h3>
        <div id="fila"></div>
    </div>

    <script>
        // Configuração do Firebase
        var firebaseConfig = {
            apiKey: "SUA_API_KEY_FIREBASE",
            authDomain: "SEU_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://SEU_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_PROJECT_ID.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        // Chaves da API do YouTube (Principal e Reserva)
        var ytKeys = ["SUA_CHAVE_YOUTUBE_PRINCIPAL", "SUA_CHAVE_YOUTUBE_RESERVA"];
        var keyIndex = 0;

        // Lista de canais prioritários de alta qualidade
        var listaCanaisHQ = [
            "sing king",
            "kantoake",
            "poptified",
            "karaokê oficial",
            "música e letra"
        ];

        // Atualização da fila em tempo real
        db.ref('karaoke/fila').on('value', function(snapshot) {
            var fDiv = document.getElementById('fila');
            fDiv.innerHTML = '';
            var data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(function(key) {
                    var item = data[key];
                    fDiv.innerHTML += "<div class='track-item'>" +
                        "<div class='track-info'>" +
                            "<span><b>" + item.cantor + "</b> - " + item.titulo + "</span>" +
                        "</div>" +
                        "<button onclick=\"window.excluir('" + key + "')\" style='background:#444;'>🗑️</button>" +
                    "</div>";
                });
            } else {
                fDiv.innerHTML = "<p style='color: var(--subtext);'>A fila está vazia.</p>";
            }
        });

        window.buscar = function() {
            var termo = document.getElementById('busca-termo').value.trim();
            var rDiv = document.getElementById('resultados');
            
            if (!termo) return;
            rDiv.innerHTML = "Buscando...";

            var url = "https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=" + 
                encodeURIComponent(termo + " karaoke") + 
                "&type=video&key=" + ytKeys[keyIndex];

            fetch(url)
                .then(function(res) {
                    if (res.status === 403 || res.status === 429) {
                        keyIndex = (keyIndex + 1) % ytKeys.length;
                        throw new Error("quota");
                    }
                    return res.json();
                })
                .then(function(data) {
                    if (data.items && data.items.length > 0) {
                        var resultadosHQ = [];
                        var resultadosGerais = [];

                        data.items.forEach(function(item) {
                            var canal = (item.snippet.channelTitle || "").toLowerCase();
                            var ehHQ = listaCanaisHQ.some(function(c) { return canal.includes(c); });
                            
                            if (ehHQ) {
                                resultadosHQ.push(item);
                            } else {
                                resultadosGerais.push(item);
                            }
                        });

                        // Prioriza os canais HQ no topo
                        var listaOrdenada = resultadosHQ.concat(resultadosGerais);

                        rDiv.innerHTML = '';
                        listaOrdenada.forEach(function(item) {
                            var vId = item.id.videoId;
                            var tit = item.snippet.title.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                            var canal = item.snippet.channelTitle || "";
                            
                            var canalLower = canal.toLowerCase();
                            var ehHQ = listaCanaisHQ.some(function(c) { return canalLower.includes(c); });
                            var seloHQ = ehHQ ? " <span class='hq-tag'>⭐ HQ</span>" : "";

                            rDiv.innerHTML += "<div class='track-item'>" +
                                "<div class='track-info'><span>" + item.snippet.title + "</span>" +
                                "<span class='channel-tag'>📺 " + canal + seloHQ + "</span></div>" +
                                "<button onclick=\"window.adicionar('" + vId + "', '" + tit + "')\">➕ Adicionar</button>" +
                                "</div>";
                        });
                    } else {
                        rDiv.innerHTML = "Nenhum resultado encontrado.";
                    }
                })
                .catch(function(err) {
                    if (err.message === "quota") {
                        window.buscar(); // Tenta novamente com a chave reserva
                    } else {
                        rDiv.innerHTML = "Erro ao carregar resultados da busca.";
                    }
                });
        };

        window.adicionar = function(id, titulo) {
            var cantor = document.getElementById('cantor-nome').value.trim();
            if (!cantor) {
                alert("Por favor, digite seu nome no campo 'Seu Nome (Cantor)' antes de adicionar uma música!");
                document.getElementById('cantor-nome').focus();
                return;
            }
            db.ref('karaoke/fila').push({ id: id, titulo: titulo, cantor: cantor });
        };

        window.excluir = function(key) {
            db.ref('karaoke/fila/' + key).remove();
        };

        function pular() {
            db.ref('karaoke/fila').once('value', function(snapshot) {
                var data = snapshot.val();
                if (data) {
                    var primeiraChave = Object.keys(data)[0];
                    db.ref('karaoke/fila/' + primeiraChave).remove();
                }
            });
        }

        function comando(cmd) {
            db.ref('karaoke/comando').set(cmd);
        }
    </script>
</body>
</html>
